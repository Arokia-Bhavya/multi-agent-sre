<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — AI SRE Copilot</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ee;
    --muted: #8a90a2;
    --accent: #5b8def;
    --danger: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 36px;
    width: 360px;
    max-width: 90vw;
    text-align: center;
  }
  .card .logo { height: 56px; width: auto; margin: 0 0 14px; }
  .card h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .card p { font-size: 13px; color: var(--muted); margin: 0 0 26px; }
  .google-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: #fff;
    color: #1f1f1f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
  }
  .google-btn:hover { background: #f3f3f3; }
  .google-btn svg { width: 18px; height: 18px; }
  .error {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--danger);
    display: none;
  }
  .error.show { display: block; }
  .footnote { margin-top: 22px; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/static/img/logo.png" alt="">
    <h1>AI SRE Copilot</h1>
    <p>Sign in with your Google account to continue.</p>
    <a class="google-btn" href="/auth/login">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3c-7.5 0-14 4.2-17.7 10.4z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.5-5.5C29.6 36 26.9 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.9 40.7 16.4 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.5 5.5C41.5 35.7 45 30.3 45 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </a>
    <div class="error" id="err">You don't have access to this SRE Copilot instance. Ask an administrator to add your Google account.</div>
    <div class="footnote">Access requires a Google account allowlisted for this deployment.</div>
  </div>
<script>
  if (new URLSearchParams(window.location.search).get("error") === "not_allowed") {
    document.getElementById("err").classList.add("show");
  }
</script>
</body>
</html>
