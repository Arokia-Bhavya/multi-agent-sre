grafana:
  adminUser: admin

prometheus:
  prometheusSpec:
    retention: 7d

# Auto-triage (Milestone 6 extension): forward every firing/resolved alert
# to the copilot web UI's webhook so a new incident gets investigated
# automatically instead of waiting for a human to notice it. Alertmanager
# only needs a plain HTTP POST receiver — no auth, since this is a local
# demo cluster.
#
# Connectivity note: the web UI (`ai-platform/webui/server.py`) runs as a
# local process on the host, not as a cluster workload, so Alertmanager
# (running inside the kind cluster) needs a route back to the host:
#   - Docker Desktop (macOS/Windows): `host.docker.internal` resolves from
#     inside kind nodes out of the box — the URL below works as-is.
#   - Linux/other Docker setups: `host.docker.internal` may not resolve;
#     use the docker bridge gateway IP instead (`ip addr show docker0`,
#     typically 172.17.0.1), or run `ai-platform/webui/server.py` as an
#     in-cluster Deployment + Service and point the URL at that instead.
# After changing this, `helm upgrade` the kube-prometheus-stack release for
# it to take effect.
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: sre-copilot-webhook
      group_by: ["alertname", "service"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 30m
      routes:
        - receiver: sre-copilot-webhook
          continue: true
    receivers:
      - name: sre-copilot-webhook
        webhook_configs:
          - url: "http://host.docker.internal:8000/api/webhook/alertmanager"
            send_resolved: true